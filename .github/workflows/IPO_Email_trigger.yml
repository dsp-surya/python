name: Daily Email Sender

on:
  schedule:
    # Runs daily at 04:30 AM UTC (adjust cron expression as needed)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab anytime

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Script
        env:
          SENDER_EMAIL: ${{ secrets.MAIL_USERNAME }}
          APP_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python ipo.py
