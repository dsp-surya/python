name: Daily_Email_Trigger

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium lxml

      - name: Run Script
        env:
          SENDER_EMAIL: ${{ secrets.MAIL_USERNAME }}
          APP_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python ipo.py
