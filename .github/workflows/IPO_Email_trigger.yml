name: Daily Email Trigger

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step to install pandas and any other required libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Script
        env:
          SENDER_EMAIL: ${{ secrets.MAIL_USERNAME }}
          APP_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python ipo.py
